<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    section {
      padding: 40px;
      text-align: center;
    }
    .cta-button {
      display: inline-block;
      padding: 12px 24px;
      margin-top: 20px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .cta-button:hover {
      background: #45a049;
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Landing Page</h1>
    <p>Your catchy tagline goes here</p>
  </header>

  <section>
    <h2>About Us</h2>
    <p>This is a simple landing page template. You can customize it with your own content, images, and links.</p>
    <a href="#signup" class="cta-button">Get Started</a>
  </section>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

  <br/>

</body>
</html>
